services:
  sec-bot:
    build: .
    container_name: sec-bot
    restart: unless-stopped

    # PID 1 = tini: корректно пересылает сигналы и убирает зомби.
    init: true

    # Боту не нужны привилегии и новые capabilities: он не монтирует,
    # не слушает порты и не меняет сеть.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Защита от fork-бомбы: реально нужно несколько процессов, не сотни.
    pids_limit: 100

    # Замерено ~54 МиБ в покое. 256 МиБ — запас ~4x на пик батч-анализа;
    # при OOM контейнер перезапустится, новости не потеряются (seen_urls).
    mem_limit: 256m
    # Бот однопоточный; 1 ядро с запасом на сеть и парсинг.
    cpus: 1.0

    # Корневая ФС только для чтения: единственные точки записи — том
    # seen_urls.json и tmpfs в /tmp (heartbeat, временные файлы).
    read_only: true
    tmpfs:
      - /tmp:size=16m

    # Секреты не хардкодятся в compose-файле, а читаются из .env:
    # `env_file` передаёт переменные внутрь контейнера,
    # а `${...}` в environment подставляет их при сборке конфигурации.
    # Файл .env должен лежать рядом с docker-compose.yml.
    env_file:
      - .env

    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

    # История отправленных новостей живёт в файле на хосте, поэтому
    # переживает пересоздание контейнера (docker compose up --build).
    # Файл должен существовать до запуска, иначе Docker создаст каталог.
    volumes:
      - ./seen_urls.json:/app/seen_urls.json

    # Ограничиваем рост логов, чтобы диск не забился за месяцы работы.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
